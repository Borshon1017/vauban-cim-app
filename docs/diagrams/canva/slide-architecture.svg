<svg xmlns="http://www.w3.org/2000/svg" width="1848" height="690" viewBox="0 0 1848 690"><rect x="2" y="150" width="278" height="300" rx="22" fill="#fafaf8" stroke="#202124" stroke-width="5"/><text x="30" y="222" font-family="Bebas Neue" font-size="56" font-weight="400" fill="#202124" text-anchor="start" letter-spacing="0.8">VAUBAN GO</text><text x="30" y="256" font-family="Poppins" font-size="19" font-weight="600" fill="#5e7692" text-anchor="start" letter-spacing="1.2">THE APP YOU USE</text><text x="30" y="304.0" font-family="Poppins" font-size="22" font-weight="400" fill="#202124" text-anchor="start">Phone or computer</text><text x="30" y="337.0" font-family="Poppins" font-size="22" font-weight="400" fill="#202124" text-anchor="start">Map · Reports · Chat</text><circle cx="141" cy="388" r="40" fill="#202124"/><g transform="translate(118.0,365.0) scale(0.958)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="6" width="18" height="36" rx="4.5"/><circle cx="24" cy="35.5" r="1.8" fill="#fff" stroke="none"/><path d="M21 10.5 H27"/></g><text x="141" y="500.0" font-family="Poppins" font-size="20" font-weight="600" fill="#4b4f54" text-anchor="middle">Background map:</text><text x="141" y="526.0" font-family="Poppins" font-size="20" font-weight="600" fill="#4b4f54" text-anchor="middle">OpenFreeMap</text><clipPath id="c1"><rect x="700" y="10" width="560" height="190" rx="20"/></clipPath><rect x="700" y="10" width="560" height="190" rx="20" fill="#eef0ee" stroke="#b3b7b3" stroke-width="2"/><rect x="700" y="10" width="560" height="14" fill="#5e7692" clip-path="url(#c1)"/><text x="734" y="79.4" font-family="Bebas Neue" font-size="52" font-weight="400" fill="#202124" text-anchor="start" letter-spacing="0.6">WHERE THE APP LIVES</text><text x="734" y="111.4" font-family="Poppins" font-size="20" font-weight="600" fill="#5e7692" text-anchor="start" letter-spacing="1.2">NETLIFY</text><text x="734" y="152.9" font-family="Poppins" font-size="25" font-weight="400" fill="#202124" text-anchor="start">Delivers the app and maps</text><circle cx="1198" cy="112.0" r="40" fill="#5e7692"/><g transform="translate(1175.0,89.0) scale(0.958)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 35 C8 35 6 27.5 11.5 24.5 C11 17 20 13.5 24.5 19 C29 12 39.5 16.5 37 25 C43.5 25.5 43.5 35 36 35 Z"/></g><clipPath id="c2"><rect x="700" y="250" width="560" height="190" rx="20"/></clipPath><rect x="700" y="250" width="560" height="190" rx="20" fill="#eef0ee" stroke="#b3b7b3" stroke-width="2"/><rect x="700" y="250" width="560" height="14" fill="#8ca984" clip-path="url(#c2)"/><text x="734" y="319.4" font-family="Bebas Neue" font-size="52" font-weight="400" fill="#202124" text-anchor="start" letter-spacing="0.6">THE DATABASE</text><text x="734" y="351.4" font-family="Poppins" font-size="20" font-weight="600" fill="#5f7f57" text-anchor="start" letter-spacing="1.2">SUPABASE</text><text x="734" y="392.9" font-family="Poppins" font-size="25" font-weight="400" fill="#202124" text-anchor="start">Stores reports privately</text><circle cx="1198" cy="352.0" r="40" fill="#8ca984"/><g transform="translate(1175.0,329.0) scale(0.958)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="12" rx="13" ry="5"/><path d="M11 12 V35 A13 5 0 0 0 37 35 V12"/><path d="M11 23.5 A13 5 0 0 0 37 23.5"/></g><clipPath id="c3"><rect x="700" y="490" width="560" height="190" rx="20"/></clipPath><rect x="700" y="490" width="560" height="190" rx="20" fill="#eef0ee" stroke="#b3b7b3" stroke-width="2"/><rect x="700" y="490" width="560" height="14" fill="#202124" clip-path="url(#c3)"/><text x="734" y="559.4" font-family="Bebas Neue" font-size="52" font-weight="400" fill="#202124" text-anchor="start" letter-spacing="0.6">THE AI ASSISTANT</text><text x="734" y="591.4" font-family="Poppins" font-size="20" font-weight="600" fill="#4b4f54" text-anchor="start" letter-spacing="1.2">GOOGLE CLOUD</text><text x="734" y="632.9" font-family="Poppins" font-size="25" font-weight="400" fill="#202124" text-anchor="start">Sends questions to the AI</text><circle cx="1198" cy="592.0" r="40" fill="#202124"/><g transform="translate(1175.0,569.0) scale(0.958)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11 H40 V33 H27 L19 41 V33 H8 Z"/><circle cx="17" cy="22" r="1.9" fill="#fff" stroke="none"/><circle cx="24" cy="22" r="1.9" fill="#fff" stroke="none"/><circle cx="31" cy="22" r="1.9" fill="#fff" stroke="none"/></g><clipPath id="c4"><rect x="1320" y="10" width="528" height="190" rx="20"/></clipPath><rect x="1320" y="10" width="528" height="190" rx="20" fill="#eef0ee" stroke="#b3b7b3" stroke-width="2"/><rect x="1320" y="10" width="528" height="14" fill="#5e7692" clip-path="url(#c4)"/><text x="1354" y="79.4" font-family="Bebas Neue" font-size="52" font-weight="400" fill="#202124" text-anchor="start" letter-spacing="0.6">OUR MAP DATA</text><text x="1354" y="111.4" font-family="Poppins" font-size="20" font-weight="600" fill="#5e7692" text-anchor="start" letter-spacing="1.2">QGIS  &gt;  GEOJSON</text><text x="1354" y="152.9" font-family="Poppins" font-size="25" font-weight="400" fill="#202124" text-anchor="start">Map files, made offline</text><circle cx="1786" cy="112.0" r="40" fill="#5e7692"/><g transform="translate(1763.0,89.0) scale(0.958)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 L42 17 L24 27 L6 17 Z"/><path d="M6 24 L24 34 L42 24"/><path d="M6 31 L24 41 L42 31"/></g><clipPath id="c5"><rect x="1320" y="490" width="528" height="190" rx="20"/></clipPath><rect x="1320" y="490" width="528" height="190" rx="20" fill="#eef0ee" stroke="#b3b7b3" stroke-width="2"/><rect x="1320" y="490" width="528" height="14" fill="#202124" clip-path="url(#c5)"/><text x="1354" y="559.4" font-family="Bebas Neue" font-size="